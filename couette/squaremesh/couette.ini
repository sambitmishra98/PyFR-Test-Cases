[soln-plugin-ascent-partition]
nsteps        = 1 
division      = 1     
region        = *     
vtkm-backend  = serial

scene-part = {"type"   : "pseudocolor", "field" : "partition",
              "options": {"mesh": {"show"       : True,
                                   "color"      : [0,0,0],
                                   "line-width" : 1}
              },
              "render-1": {"image-name"  : "ascents/partition",
                           "image-width" : 512, "image-height": 512}}

